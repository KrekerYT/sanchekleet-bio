<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLACKCASE · кейсы, батлы, апгрейдер</title>
<style>
:root{color-scheme:dark;--bg:#0b0c14;--p:#131522;--p2:#1b1e30;--b:rgba(255,255,255,.08);--mu:#8a92b2;--ac:linear-gradient(135deg,#ffb800 0%,#ff7a00 100%);--ac2:linear-gradient(135deg,#ffffff 0%,#c9cdd8 55%,#8e93a1 100%);--gr:#52e08a}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1100px 600px at 55% -150px,#252945,var(--bg) 65%) var(--bg);color:#fff;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.app{display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{width:210px;flex:none;background:var(--p);border-right:1px solid var(--b);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:2px;padding:4px 10px 16px;cursor:pointer;user-select:none;background:var(--ac);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
aside button{font:inherit;text-align:left;color:#b9bfdc;background:none;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;transition:.2s}
aside button:hover{background:var(--p2)}aside button.on{background:var(--ac);color:#111;font-weight:800;box-shadow:0 6px 20px rgba(255,168,0,.28)}
.main{flex:1;min-width:0;padding:12px 22px 36px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
#tick{display:flex;gap:8px;overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.mi{flex:none;width:96px;height:64px;border-radius:9px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 35%,transparent),var(--p));border-bottom:2px solid var(--c);text-align:center;overflow:hidden;padding-top:2px}
.mi img{height:42px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}.mi small{display:block;font-size:.62rem;color:var(--gr);font-weight:700;line-height:1.1}
.me{display:flex;gap:8px;align-items:center;flex:none}
.chip{font:inherit;color:#c9ceea;background:var(--p);border:1px solid var(--b);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.2s;user-select:none}.chip:hover{border-color:#ffb800;color:#fff}.chip.on{background:var(--ac);color:#111;font-weight:800;border-color:transparent;box-shadow:0 4px 14px rgba(255,168,0,.25)}
.btn{font:inherit;font-weight:800;color:#111;background:var(--ac);border:0;border-radius:10px;padding:11px 26px;cursor:pointer;box-shadow:0 6px 22px rgba(255,168,0,.25);transition:.2s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.alt{background:var(--p2);color:#fff;box-shadow:none;border:1px solid var(--b)}.btn.sm{padding:6px 13px;font-size:.78rem}
.pan{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:20px;margin-bottom:18px}.c{text-align:center}h2,h3,h4{margin:8px 0 12px}
input,select{font:inherit;color:#fff;background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:10px 14px;width:100%;margin-bottom:12px}

/* ===== СТИЛЬ КЕЙСОВ И КАТЕГОРИЙ (CASE-BATTLE STYLE) ===== */
.sec-t{text-align:center;font-size:1.35rem;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;margin:26px 0 18px;color:#fff;position:relative}
.sec-t::after{content:"";display:block;width:64px;height:3px;background:var(--ac);margin:8px auto 0;border-radius:3px;box-shadow:0 0 12px rgba(255,184,0,.6)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:18px;margin-bottom:24px}
.cc{cursor:pointer;text-align:center;padding:20px 12px 16px;border-radius:18px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--clr,#ffb800) 26%,transparent),var(--p) 72%);border:1px solid var(--b);transition:.28s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--clr,#ffb800) 22%,transparent),transparent 60%);opacity:0;transition:.28s}
.cc:hover{transform:translateY(-7px);border-color:color-mix(in srgb,var(--clr,#ffb800) 65%,#fff);box-shadow:0 16px 38px rgba(0,0,0,.6),0 0 26px color-mix(in srgb,var(--clr,#ffb800) 24%,transparent)}
.cc:hover::before{opacity:1}
.cc img{width:156px;height:122px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.75));transition:transform .32s cubic-bezier(.2,.8,.2,1);position:relative;z-index:1}
.cc:hover img{transform:scale(1.08) translateY(-4px) rotate(-1.5deg)}
.cc b{display:block;font-size:.98rem;font-weight:800;margin:10px 0 8px;color:#fff;letter-spacing:.3px;position:relative;z-index:1}
.pr{display:inline-flex;align-items:center;justify-content:center;padding:6px 20px;border-radius:9px;background:var(--ac);color:#111;font-weight:900;font-size:.9rem;box-shadow:0 4px 15px rgba(255,168,0,.3);position:relative;z-index:1;transition:.2s}
.cc:hover .pr{transform:scale(1.05);box-shadow:0 6px 20px rgba(255,168,0,.5)}

/* ===== КАРТОЧКИ СКИНОВ И ЦЕНЫ ===== */
.it{width:155px;flex:none;margin:5px;padding:10px 8px 9px;border-radius:12px;text-align:center;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--c) 36%,transparent),var(--p2) 76%);border:1px solid rgba(255,255,255,.05);border-bottom:3px solid var(--c);font-size:.73rem;position:relative;transition:.2s;overflow:hidden}
.it:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.it img{width:124px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.65));margin:6px 0 2px;transition:.2s}
.it:hover img{transform:scale(1.06)}
.it small,.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mu);font-size:.66rem;text-transform:uppercase;letter-spacing:.4px}
.it b{color:#fff;font-size:.78rem;margin:2px 0 5px}
.it i{display:inline-block;font-style:normal;background:rgba(11,12,20,.75);border:1px solid rgba(82,224,138,.28);padding:2px 10px;border-radius:6px;color:var(--gr);font-weight:800;font-size:.76rem}
.it em{position:absolute;top:6px;right:8px;font-style:normal;font-size:.6rem;font-weight:700;color:#cdd3f3;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:4px}
.it .ch{position:absolute;top:6px;left:8px;font-size:.58rem;color:var(--mu);font-weight:700}

.list{display:flex;flex-wrap:wrap;justify-content:center}.pick{cursor:pointer}.sel .it{outline:2px solid #ffb800;box-shadow:0 0 22px var(--c)}.scroll{max-height:390px;overflow:auto}
.rl{position:relative;overflow:hidden;margin:10px 0;border-radius:14px;background:#070810;border:1px solid var(--b);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.rl::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#ffb800;box-shadow:0 0 16px 3px rgba(255,184,0,.9);z-index:2}
.tr{display:flex;transition:transform 5.2s cubic-bezier(.08,.6,0,1)}.res{margin:14px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:12px 0}
.hero{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}.hero img{width:185px;height:145px;object-fit:contain;filter:drop-shadow(0 12px 26px rgba(0,0,0,.75))}
.mult-bar{display:inline-flex;background:var(--p2);padding:4px;border-radius:11px;border:1px solid var(--b);gap:4px}
.mult-bar button{font:inherit;font-weight:800;font-size:.82rem;color:var(--mu);background:none;border:0;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.2s}
.mult-bar button.on{background:var(--ac);color:#111;box-shadow:0 2px 10px rgba(255,168,0,.3)}

#ld{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#t{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:11px 22px;border-radius:10px;background:var(--ac);color:#111;font-weight:800;transition:.3s;z-index:30;pointer-events:none}#t.on{opacity:1;transform:translate(-50%,0)}
.note{color:var(--mu);font-size:.72rem;text-align:center;margin-top:26px}
.uc{display:flex;gap:11px;align-items:center;line-height:1.15;background:var(--p);padding:6px 12px;border-radius:14px;border:1px solid var(--b)}
.un,.bl{display:flex;flex-direction:column;gap:2px}.uc small{color:var(--mu);font-size:.66rem}.nk{font-size:.86rem;cursor:pointer;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}.nk:hover{color:#ffb800}
.bl{padding-left:12px;border-left:1px solid var(--b)}#bal{font-size:.95rem;font-weight:800;color:var(--gr)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;object-fit:cover;flex:none;border:2px solid #ffb800;cursor:pointer}
.ib{width:35px;height:35px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--b);border-radius:10px;color:#aeb3c4;cursor:pointer;transition:.2s}.ib:hover{color:#fff;border-color:#ffb800}

.ut{text-align:center;letter-spacing:1px;font-weight:800;margin:6px 0 14px}.ug{display:grid;grid-template-columns:1fr 310px 1fr;gap:14px;align-items:stretch;margin-bottom:14px}.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.up-p{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:14px;padding:14px;min-width:0}.hd{font-weight:700;margin-bottom:10px}.sg{display:flex;flex-wrap:wrap;justify-content:center;min-height:190px;align-content:flex-start}.sg .it{width:118px;margin:4px;font-size:.65rem}.sg .it img{width:88px;height:64px}.sg.one .it{width:190px}.sg.one .it img{width:150px;height:112px}
.ph{color:var(--mu);margin:auto;padding:60px 10px;text-align:center;width:100%}.sm{margin-top:8px;color:var(--mu)}.sm b{color:var(--gr)}.dial{display:grid;place-items:center}.dial svg{width:100%;max-width:310px}#pt{transition:transform 4.2s cubic-bezier(.1,.7,.1,1);transform-origin:150px 150px}
.slid{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--mu)}.slid input{margin:0;padding:0;flex:1;accent-color:#ffb800}.slid b{color:#fff;min-width:60px;text-align:right}.btn.big{width:100%;padding:16px;font-size:1.05rem;letter-spacing:1px}.mlt{margin:0;justify-content:flex-end}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.flt input,.flt select{width:auto;flex:1;min-width:70px;margin:0;padding:7px 10px}.flt b{flex:100%;color:var(--mu)}
@media(max-width:900px){.ug,.lists{grid-template-columns:1fr}.mlt{justify-content:center}.uc small:first-child{display:none}}
@media(max-width:800px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.logo{padding:8px 10px}aside button{white-space:nowrap}.it{width:136px}}
@media(prefers-reduced-motion:reduce){.tr,#pt{transition-duration:.01s}}
</style>
</head>
<body>
<div id="ld"><div class="logo" style="font-size:2.2rem">BLACKCASE</div><div id="lt">Загружаю каталог скинов и цены…</div></div>
<div class="app">
<aside id="side"></aside>
<div class="main">
<div class="top"><div id="tick"></div><div class="me" id="usr"></div></div>
<main id="v"></main>
<div class="note">Симулятор на виртуальной валюте: пополнение и вывод реальных денег не поддерживаются. Не связан с Valve и Steam. Картинки и названия предметов загружаются из открытых источников, цены ориентировочные.</div>
</div></div>
<div id="t"></div>
<script>
/* ===== Источники данных ===== */
const SRC='https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/',PRICES='https://prices.csgotrader.app/latest/prices_v6.json',NBU='https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&json';
const $=s=>document.querySelector(s),rnd=a=>a[Math.random()*a.length|0];
const RC=['#4b69ff','#8847ff','#d32ce6','#eb4b4b','#ffd700'],EST=[.45,2.6,11,55,380];
const WN=['Factory New','Minimal Wear','Field-Tested','Well-Worn','Battle-Scarred'],WW=[3,7,33,24,33],TM={'Mil-Spec Grade':0,'Restricted':1,'Classified':2,'Covert':3};

/* ===== Перехват входа через Steam OpenID ===== */
(function(){
  const p=new URLSearchParams(location.search),c=p.get('openid.claimed_id')||p.get('steamid'),m=c&&c.match(/(\d{17})/);
  if(m){try{localStorage.setItem('bc_id',m[1])}catch(e){}history.replaceState(null,'',location.pathname)}
})();

let ID='';try{ID=localStorage.getItem('bc_id')||''}catch(e){}
let SK={},CS=[],PR={},RATE=41.5,CAT=null,pm=0,S={bal:25,lock:1,inv:[],nick:'',ava:''},tab='cases',oc=-1,Q='',busy=0,ang=0,fast=0,cnt=1,up={sel:[],add:0,tg:null,q:'',s:'a',lo:'',hi:''};

function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem('bc4_'+(ID||'guest')));
    if(d&&d.inv)S={bal:25,lock:1,inv:[],nick:'',ava:'',...d};
  }catch(e){}
}
loadState();
const save=()=>{try{localStorage.setItem('bc4_'+(ID||'guest'),JSON.stringify(S))}catch(e){}};
const f=v=>'₴'+(v>=1000?Math.round(v).toLocaleString('uk-UA'):v.toFixed(2)),img=u=>u&&(u.startsWith('http')?u:u+'/200fx150f');
const tierS=s=>/Knives|Gloves/.test(s.category?.name||'')?4:(TM[s.rarity?.name]??0);

function usd(h){
  const p=PR[h];if(!p)return null;
  const s=p.steam||{};
  return +s.last_24h||+s.last_7d||+s.last_30d||+s.last_90d||(p.skinport&&+p.skinport.starting_at)||(p.csgotrader&&+p.csgotrader.price)||null;
}
const hn=(s,w)=>w?s.name+' ('+w+')':s.name;
function pUSD(s,w,t){
  const v=usd(hn(s,w));if(v)return v;
  let h=0;for(const c of s.id)h=(h*31+c.charCodeAt(0))%97;
  return EST[t]*(.55+h/115);
}
const wl=s=>(s.wears||[]).map(w=>w.name);
const dw=s=>{const a=wl(s);return a.includes('Field-Tested')?'Field-Tested':a[0]||''};
const mk=(s,t,w)=>({n:s.name,im:s.image,r:t,w,p:+(pUSD(s,w,t)*RATE).toFixed(2)});
const tierP=p=>p<40?0:p<180?1:p<750?2:p<3200?3:4;
const spread=(a,n)=>a.length<=n?a:Array.from({length:n},(_,i)=>a[Math.round(i*(a.length-1)/(n-1))]);

/* ===== SVG-иконки кейсов в стиле Case-Battle ===== */
const crate=(l,c1,c2)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170"><defs><radialGradient id="g" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="${c1}" stop-opacity=".55"/><stop offset="100%" stop-color="${c1}" stop-opacity="0"/></radialGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient><linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2e42"/><stop offset="1" stop-color="#121420"/></linearGradient></defs><circle cx="110" cy="85" r="78" fill="url(#g)"/><path d="M32 62l78-32 78 32v58l-78 32-78-32z" fill="url(#d)" stroke="url(#b)" stroke-width="3"/><path d="M32 62l78 30 78-30" fill="none" stroke="url(#b)" stroke-width="2.5"/><path d="M110 92v60" fill="none" stroke="url(#b)" stroke-width="2.5"/><polygon points="110,36 168,60 110,82 52,60" fill="url(#b)" opacity=".28"/><rect x="64" y="94" width="92" height="30" rx="8" fill="#0b0c14" stroke="url(#b)" stroke-width="2"/><text x="110" y="114" text-anchor="middle" font-family="system-ui,Arial" font-weight="900" font-size="15" fill="#fff" letter-spacing="1">${l}</text></svg>`);

function mkCase(n,pr,im,clr,cat,pl,rtp){
  pl=spread(pl.sort((a,b)=>a.p-b.p),42);
  if(!pl.length)return null;
  const ev=a=>{let s=0,w=0;for(const x of pl){const k=Math.pow(x.p,-a);s+=k*x.p;w+=k}return s/w},tg=pr*rtp;
  let lo=-2,hi=8;for(let i=0;i<40;i++){const m=(lo+hi)/2;ev(m)>tg?lo=m:hi=m}
  const ws=pl.map(x=>Math.pow(x.p,-hi)),tot=ws.reduce((a,b)=>a+b,0);
  pl.forEach((x,i)=>{x.ch=ws[i]/tot*100;x.r=tierP(x.p)});
  return{n,pr,im,clr,cat,pool:pl,ws,tot};
}
function pool(fn,lo,hi){
  const o=[];
  for(const s of Object.values(SK)){
    if(!fn(s))continue;
    const a=wl(s);
    for(const w of a.length?a:['']){
      const p=+(pUSD(s,w,tierS(s))*RATE).toFixed(2);
      if(p>=lo&&p<=hi)o.push({n:s.name,im:s.image,w,p});
    }
  }
  return o;
}

/* ===== Сетка кейсов и цен в стиле Case-Battle ===== */
const mkCases=()=>[
  mkCase('Первая кровь',19,crate('BLOOD','#ff4b4b','#7a0c0c'),'#ff4b4b','Фирменные кейсы',pool(s=>!/Knives|Gloves/.test(s.category?.name||''),2,180),.8),
  mkCase('Ночной дозор',39,crate('NIGHT','#7a5cff','#1d1259'),'#7a5cff','Фирменные кейсы',pool(s=>!/Knives|Gloves/.test(s.category?.name||''),8,390),.8),
  mkCase('Киберпанк',59,crate('CYBER','#00e5ff','#004b6b'),'#00e5ff','Фирменные кейсы',pool(s=>!/Knives|Gloves/.test(s.category?.name||''),15,650),.8),
  mkCase('Токсичный',89,crate('TOXIC','#52e08a','#0c592b'),'#52e08a','Фирменные кейсы',pool(s=>!/Knives|Gloves/.test(s.category?.name||''),25,950),.8),
  mkCase('Золотой запас',149,crate('GOLD','#ffb800','#7a4b00'),'#ffb800','Фирменные кейсы',pool(s=>true,45,1800),.8),
  mkCase('Элита CS2',299,crate('ELITE','#ff2a85','#6b0030'),'#ff2a85','Фирменные кейсы',pool(s=>true,90,4200),.8),

  mkCase('Глок и ЮСП',29,crate('PISTOL','#3b82f6','#172554'),'#3b82f6','Оружейные и редкие',pool(s=>/Glock-18|USP-S|Desert Eagle/.test(s.weapon?.name||''),5,350),.8),
  mkCase('Калашников',75,crate('AK-47','#f97316','#5c2104'),'#f97316','Оружейные и редкие',pool(s=>s.weapon?.name=='AK-47',20,1600),.8),
  mkCase('Секрет М4',85,crate('M4A1','#a855f7','#3b0764'),'#a855f7','Оружейные и редкие',pool(s=>/M4A4|M4A1-S/.test(s.weapon?.name||''),20,1700),.8),
  mkCase('Мечта Авапера',129,crate('AWP','#ef4444','#450a0a'),'#ef4444','Оружейные и редкие',pool(s=>s.weapon?.name=='AWP',35,3500),.8),
  mkCase('Королевский лоар',499,crate('LORE','#eab308','#422006'),'#eab308','Оружейные и редкие',pool(s=>true,180,15000),.82),
  mkCase('Ножевой удар',999,crate('KNIFE','#ec4899','#500724'),'#ec4899','Оружейные и редкие',pool(s=>/Knives|Gloves/.test(s.category?.name||''),400,65000),.85)
].filter(Boolean);

function pick(c){let r=Math.random()*c.tot,i=0;while(i<c.pool.length-1&&r>=c.ws[i]){r-=c.ws[i];i++}const x=c.pool[i];return{n:x.n,im:x.im,r:x.r,w:x.w,p:x.p}}
const ab=w=>w?w.split(/[ -]/).map(a=>a[0]).join(''):'';
const card=(x,shCh=0)=>{const p=x.n.split(' | ');return`<div class="it" style="--c:${RC[x.r||0]}">${shCh&&x.ch?`<span class="ch">${x.ch<.05?'<0.05':x.ch.toFixed(2)}%</span>`:''}<em>${ab(x.w)}</em><img src="${img(x.im)}" loading="lazy" referrerpolicy="no-referrer" alt=""><small>${p[0]}</small><b>${p[1]||'Vanilla'}</b><i>${f(x.p)}</i></div>`};

function t(m){const e=$('#t');e.textContent=m;e.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>e.classList.remove('on'),2500)}

/* Надежный загрузчик ника и аватарки из Steam через цепочку прокси */
async function prof(input,force=false){
  let raw=(input||ID||'').trim();
  if(!raw)return;
  let targetUrl='';
  const idMatch=raw.match(/(\d{17})/);
  const vanityMatch=raw.match(/steamcommunity\.com\/id\/([^/?#]+)/i);
  if(idMatch){
    ID=idMatch[1];
    targetUrl=`https://steamcommunity.com/profiles/${ID}?xml=1`;
  }else if(vanityMatch){
    targetUrl=`https://steamcommunity.com/id/${vanityMatch[1]}?xml=1`;
  }else if(/^[a-zA-Z0-9_-]{2,32}$/.test(raw)){
    targetUrl=`https://steamcommunity.com/id/${raw}?xml=1`;
  }else return t('Некорректный формат SteamID или ссылки');

  const proxies=[
    `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
  ];

  for(const pUrl of proxies){
    try{
      const r=await fetch(pUrl);
      if(!r.ok)continue;
      let xml='';
      if(pUrl.includes('/get?url=')){
        const j=await r.json();
        xml=j.contents||'';
      }else{
        xml=await r.text();
      }
      if(!xml||!xml.includes('<steamID'))continue;
      const sid64=(xml.match(/<steamID64>\s*(\d{17})\s*<\/steamID64>/)||[])[1];
      const sNick=(xml.match(/<steamID><!\[CDATA\[([\s\S]*?)\]\]><\/steamID>/)||xml.match(/<steamID>([^<]+)<\/steamID>/)||[])[1];
      const sAva=(xml.match(/<avatarFull><!\[CDATA\[([\s\S]*?)\]\]><\/avatarFull>/)||xml.match(/<avatarFull>([^<]+)<\/avatarFull>/)||[])[1];

      if(sid64){
        ID=sid64;
        try{localStorage.setItem('bc_id',ID)}catch(e){}
        loadState();
      }
      if(sNick&&sNick.trim()){
        S.nick=sNick.trim();
        if(sAva&&sAva.trim())S.ava=sAva.trim();
        save();usr();
        if(force)t(`Привет, ${S.nick}! Профиль Steam загружен`);
        return;
      }
    }catch(e){}
  }
  if(ID){try{localStorage.setItem('bc_id',ID)}catch(e){}save();usr();}
  if(force)t('Профиль привязан, но Steam временно скрыл XML-данные (проверьте приватность профиля)');
}

    const tr=$('#tr_'+idx);tr.getBoundingClientRect();
    const W=tr.parentElement.clientWidth,iw=tr.children[0].offsetWidth+10;
    tr.style.transform=`translateX(${-(45*iw+iw/2-W/2+(Math.random()*iw*.55-iw*.275))}px)`;
    if(idx===0)tr.addEventListener('transitionend',done,{once:true});
  });
}

/* ===== Инициализация ===== */
async function init(){
  const L=$('#lt');
  try{
    L.textContent='Загружаю каталог скинов CS2…';
    const sk=await fetch(SRC+'skins.json').then(r=>r.json());
    sk.forEach(s=>SK[s.id]=s);
    L.textContent='Загружаю рыночные цены и курс гривны…';
    await Promise.allSettled([
      fetch(NBU).then(r=>r.json()).then(d=>{RATE=+d[0].rate||RATE}),
      fetch(PRICES).then(r=>r.json()).then(d=>{PR=d;pm=1})
    ]);
    CS=mkCases();
    for(let i=0;i<14;i++)addDrop();
    setInterval(addDrop,2400);
    render();
    $('#ld').remove();
    if(ID)prof(ID);
    t(`${Object.keys(SK).length} скинов · ${CS.length} кейсов · курс ${RATE.toFixed(2)} ₴`);
  }catch(e){
    L.innerHTML='Не удалось загрузить каталог скинов. Проверьте подключение к интернету.<br><br><button class="btn" onclick="location.reload()">Повторить</button>';
  }
}
init();
</script>
