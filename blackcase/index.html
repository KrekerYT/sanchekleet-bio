const BP='https://csgobackpack.net/api/GetItemsList/v2/?no_details=1&currency=USD',bp=d=>{const L=d&&d.items_list;if(!L)throw 0;const o={};for(const k in L){const x=L[k],q=x&&x.price;if(!q)continue;const v=q['24_hours']||q['7_days']||q['30_days']||q['all_time']||{},m=+v.median||+v.average;if(m>0)o[x.name||k]={steam:{last_24h:m}}}return o};

}catch(e){L.innerHTML='Не удалось загрузить данные. Откройте файл в браузере с доступом в интернет или разместите его на своём хостинге.<br><br><button class="btn" onclick="location.reload()">Повторить</button>'}}
