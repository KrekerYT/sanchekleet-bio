<style>

.tr{display:flex;transition:transform 5.5s cubic-bezier(.08,.6,0,1)}.res{margin:10px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:12px 0}
.hero{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}.hero img{width:220px;max-width:60vw;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}svg.ring{max-width:260px;width:100%}#pt{transition:transform 4.2s cubic-bezier(.1,.7,.1,1);transform-origin:150px 150px}

.bcols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}.bcols .pan{padding:10px;margin:0}.bcols .it{width:100%;margin:4px 0}.win{box-shadow:0 0 36px rgba(255,255,255,.4);border-color:#fff}
#ld{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}

.cs{display:flex;align-items:center;gap:8px}.ph2{color:var(--mu);padding:30px;text-align:center;width:100%}

.uc{display:flex;gap:12px;align-items:center;line-height:1.15}.un,.bl{display:flex;flex-direction:column;gap:2px}.uc small{color:var(--mu);font-size:.68rem}.nk{font-size:.86rem;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bl{padding-left:12px;border-left:1px solid var(--b)}#bal{font-size:.95rem;font-weight:800;color:var(--gr)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.3)}.ib{width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid var(--b);border-radius:10px;color:#aeb3c4;cursor:pointer;transition:.2s}.ib:hover{color:#fff;border-color:#e3e6ee;background:var(--p2)}
.ut{text-align:center;letter-spacing:1px;font-weight:700;margin:6px 0 14px}.ug{display:grid;grid-template-columns:1fr 310px 1fr;gap:14px;align-items:stretch;margin-bottom:14px}.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.up-p{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:12px;padding:14px;min-width:0}.hd{font-weight:700;margin-bottom:10px}.sg{display:flex;flex-wrap:wrap;justify-content:center;min-height:190px;align-content:flex-start}.sg .it{width:112px;margin:4px;font-size:.62rem}.sg .it img{width:84px;height:62px}.sg.one .it{width:190px}.sg.one .it img{width:150px;height:112px}
.ph{color:var(--mu);margin:auto;padding:60px 10px;text-align:center;width:100%}.sm{margin-top:8px;color:var(--mu)}.sm b{color:var(--gr)}.dial{display:grid;place-items:center}.dial svg{width:100%;max-width:310px}
.slid{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--mu)}.slid input{margin:0;padding:0;flex:1;accent-color:#d9dce5}.slid b{color:#fff;min-width:56px;text-align:right}.btn.big{width:100%;padding:16px;font-size:1.05rem;letter-spacing:1px}.mlt{margin:0;justify-content:flex-end}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.flt input,.flt select{width:auto;flex:1;min-width:70px;margin:0;padding:7px 10px}.flt b{flex:100%;color:var(--mu)}
@media(max-width:900px){.ug,.lists{grid-template-columns:1fr}.mlt{justify-content:center}.uc small:first-child{display:none}}
@media(max-width:800px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.logo{padding:8px 10px}aside button{white-space:nowrap}.bcols .it{font-size:.58rem}.bcols .it img{width:70px;height:52px}.it{width:130px}}
@media(prefers-reduced-motion:reduce){.tr,#pt{transition-duration:.01s}}
</style>

<body>
<div id="ld"><div class="logo" style="font-size:2rem">BLACKCASE</div><div id="lt">Загружаю каталог скинов…</div></div>
<div class="app">
<aside id="side"></aside>
<div class="main">
<div class="top"><div id="tick"></div><div class="me" id="usr"></div></div>
<main id="v"></main>
<div class="note">Симулятор на виртуальной валюте: пополнение и вывод реальных денег не поддерживаются. Не связан с Valve и Steam. Картинки и названия предметов загружаются из открытых источников, цены ориентировочные.</div>
</div></div>
<div id="t"></div>
<script>
const CI=['case1.jpg','case2.jpg'];
/* ===== Источники данных (грузятся в браузере) ===== */
const SRC='https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/',PRICES='https://prices.csgotrader.app/latest/prices_v6.json',NBU='https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&json';
const $=s=>document.querySelector(s),rnd=a=>a[Math.random()*a.length|0],sl=ms=>new Promise(r=>setTimeout(r,ms));
const RC=['#4b69ff','#8847ff','#d32ce6','#eb4b4b','#ffd700'],RN=['Mil-Spec','Restricted','Classified','Covert','Rare Special'],BASE=[79.92,15.98,3.2,.64,.26],EST=[.5,3,12,60,400];
const WN=['Factory New','Minimal Wear','Field-Tested','Well-Worn','Battle-Scarred'],WW=[3,7,33,24,33],WR=['Прямо с завода','Немного поношенное','После полевых испытаний','Поношенное','Закалённое в боях'],WA=['ПЗ','НП','ПИ','ПН','ЗБ'],TM={'Mil-Spec Grade':0,'Restricted':1,'Classified':2,'Covert':3};
(function(){const p=new URLSearchParams(location.search),c=p.get('openid.claimed_id'),m=c&&c.match(/\/openid\/id\/(\d{17})$/);if(m&&p.get('openid.mode')=='id_res'){try{localStorage.setItem('bc_id',m[1])}catch(e){}history.replaceState(null,'',location.pathname)}})();
let ID='';try{ID=localStorage.getItem('bc_id')||''}catch(e){}
let SK={},CS=[],PR={},RATE=41.5,CAT=null,pm=0,S={bal:25,lock:1,inv:[]},tab='cases',oc=-1,Q='',busy=0,ang=0,fast=0,up={sel:[],add:0,tg:null,q:'',s:'a',lo:'',hi:'',k:'w',n:60};
try{const d=JSON.parse(localStorage.getItem('bc4_'+(ID||'guest')));if(d&&d.inv)S=d}catch(e){}
if(!S.v3){S.v3=1;S.nc=0;S.ps=0;if(/^Игрок \d{4}$/.test(S.nick||''))S.nick=''}
const save=()=>{try{localStorage.setItem('bc4_'+(ID||'guest'),JSON.stringify(S))}catch(e){}};
const f=v=>'₴'+(v>=1000?Math.round(v).toLocaleString('uk-UA'):v.toFixed(2)),img=u=>u+'/200fx150f';
const tierS=s=>s.st?0:/Knives|Gloves/.test(s.category.name)?4:(TM[s.rarity.name]??0);
function usd(h){const p=PR[h];if(!p)return null;const s=p.steam||{};return +s.last_24h||+s.last_7d||+s.last_30d||+s.last_90d||(p.skinport&&+p.skinport.starting_at)||(p.csgotrader&&+p.csgotrader.price)||null}
const hn=(s,w)=>w?s.name+' ('+w+')':s.name,dn=s=>s.ru||s.name;
function pUSD(s,w,t){const v=usd(hn(s,w));if(v)return v;let h=2166136261;for(const c of s.id+'|'+w){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}const u=((h>>>0)%100000)/100000,k=[1,.8,.62,.5,.42][WN.indexOf(w)]||1;return EST[t]*Math.exp((u-.5)*2.4)*k}
const wl=s=>(s.wears||[]).map(w=>w.name);
function rw(s){const a=wl(s);if(!a.length)return'';let r=Math.random()*a.reduce((x,w)=>x+WW[WN.indexOf(w)],0);for(const w of a){r-=WW[WN.indexOf(w)];if(r<0)return w}return a[0]}
const dw=s=>{const a=wl(s);return a.includes('Field-Tested')?'Field-Tested':a[0]||''};
const mk=(s,t,w)=>({n:dn(s),e:s.name,im:s.image,r:t,w,k:s.st?'t':/Knives|Gloves/.test(s.category.name)?'k':'w',p:+(pUSD(s,w,t)*RATE).toFixed(2)});
function avg(s,t){if(s._a)return s._a;const a=wl(s);const w=a.length?a:[''];return s._a=w.reduce((x,y)=>x+pUSD(s,y,t),0)/w.length*RATE}
const tierP=p=>p<5?0:p<30?1:p<120?2:p<400?3:4;
const spread=(a,n)=>a.length<=n?a:Array.from({length:n},(_,i)=>a[Math.round(i*(a.length-1)/(n-1))]);
const crate=(l,c)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f8"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><path d="M30 55l70-30 70 30v60l-70 30-70-30z" fill="url(#a)"/><path d="M30 55l70 30 70-30M100 85v60" fill="none" stroke="#111" stroke-opacity=".35" stroke-width="3"/><rect x="68" y="92" width="64" height="26" rx="6" fill="#0b0b0e" fill-opacity=".85"/><text x="100" y="111" text-anchor="middle" font-family="Arial" font-weight="900" font-size="16" fill="#fff">${l}</text></svg>`);
let stOK=0;const skipSt=s=>s.st&&stOK&&!usd(s.name);
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const geo=(a,b,n)=>Array.from({length:n},(_,i)=>a*Math.pow(b/a,i/(n-1)));
const stn=n=>n.startsWith('★ ')?'★ StatTrak™ '+n.slice(2):'StatTrak™ '+n;
function vars(fn){const o=[];for(const s of Object.values(SK)){if(s.st||!fn(s))continue;const a=wl(s);for(const w of a.length?a:['']){if(pm&&!usd(hn(s,w)))continue;const p=+(pUSD(s,w,tierS(s))*RATE).toFixed(2);if(p>=.5)o.push({s,w,p})}}return o}
function svars(){const o=[];for(const s of Object.values(SK)){if(!s.st||skipSt(s))continue;const p=+(pUSD(s,'',0)*RATE).toFixed(2);if(p>=.5)o.push({s,w:'',p})}return o}
function nr(V,t,used,R){const c=V.filter(v=>!used.has(v.s.id)).sort((a,b)=>Math.abs(Math.log(a.p/t))-Math.abs(Math.log(b.p/t))).slice(0,3);return c.length?c[R()*c.length|0]:null}
const itm=(v,n,p,e)=>({n:n||dn(v.s),e:e||v.s.name,im:v.s.image,w:v.w,p:p==null?v.p:p,st:0});
function mkCase(n,pr,im,pl,rtp){pl.sort((a,b)=>a.p-b.p);const mn=pl.length?pl[0].p*1.25:0;if(pr*rtp<mn)pr=Math.ceil(mn/rtp/5)*5;
const W=a=>pl.map(x=>Math.pow(x.p,-a)),ev=a=>{let s=0,t=0;W(a).forEach((v,i)=>{s+=v*pl[i].p;t+=v});return s/t},tg=pr*rtp;let lo=0,hi=30;for(let i=0;i<50;i++){const m=(lo+hi)/2;ev(m)>tg?lo=m:hi=m}
const ws=W(hi),tot=ws.reduce((a,b)=>a+b);pl.forEach(x=>{x.r=tierP(x.p)});return{n,pr,im,pool:pl,ws,tot}}
function mkCases(){const R=rng(20261024),used=new Set();
/* Кейс 1: ~35 предметов, каждый скин один раз, плюс несколько StatTrak-версий и стикеры */
const V1=vars(s=>!/Knives|Gloves|Equipment/.test(s.category.name)&&!(s.weapon&&s.weapon.name=='AWP')&&s.category.name!='Sticker').filter(v=>v.p<=3000),A=[];
for(const t of geo(2,2500,26)){const v=nr(V1,t,used,R);if(v){used.add(v.s.id);A.push(v)}}
for(let i=0;A.length<26&&i<40;i++){const v=nr(V1,2+R()*2000,used,R);if(v){used.add(v.s.id);A.push(v)}}
const c1=A.map(v=>itm(v)),stl=[];
for(const v of A){if(!v.s.stattrak)continue;const pu=usd(stn(v.s.name)+' ('+v.w+')'),p=pu?pu*RATE:(pm?0:v.p*1.6);if(p>=1)stl.push(itm(v,stn(dn(v.s)),+p.toFixed(2),stn(v.s.name)))}
c1.push(...spread(stl,5));
const SV=svars();for(const t of [4,15,60,250]){const v=nr(SV,t,used,R);if(v){used.add(v.s.id);c1.push(itm(v))}}
/* Кейс 2: 10 разных AWP от минимальной цены до ₴1000 */
const V2=vars(s=>s.weapon&&s.weapon.name=='AWP').filter(v=>v.p<=1000),c2=[],mn=V2.length?Math.min(...V2.map(v=>v.p)):1;
for(const t of geo(Math.max(1,mn),1000,10)){const v=nr(V2,t,used,R);if(v){used.add(v.s.id);c2.push(itm(v))}}
return[mkCase('Первый',25,CI[0],c1,.5),mkCase('Мечта авапера',67,CI[1],c2,.5)]}
function pick(c){let r=Math.random()*c.tot,i=0;while(i<c.pool.length-1&&r>=c.ws[i]){r-=c.ws[i];i++}const x=c.pool[i];return{n:x.n,im:x.im,r:x.r,w:x.w,p:x.p}}
const ab=w=>WA[WN.indexOf(w)]||'';
const card=x=>{const p=x.n.split(' | ');return`<div class="it" style="--c:${RC[x.r]}"><em title="${WR[WN.indexOf(x.w)]||''}">${ab(x.w)}</em><img src="${img(x.im)}" loading="lazy" referrerpolicy="no-referrer" alt=""><small>${p[0]}</small><b>${p[1]||'Обычный'}</b><i>${f(x.p)}</i></div>`};
function t(m){const e=$('#t');e.textContent=m;e.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>e.classList.remove('on'),2300)}
const bal=()=>{const e=$('#bal');if(!e)return;e.textContent=f(S.bal)+(S.lock?' 🔒':'');e.title=S.lock?'Заблокировано до пополнения от ₴100':''};
const TABS={cases:'📦 Кейсы',up:'⬆️ Апгрейд',inv:'🎒 Инвентарь'};
function go(x){if(busy)return t('Дождитесь окончания');up={sel:[],add:0,tg:null,q:'',s:'a',lo:'',hi:'',k:'w',n:60};tab=x;oc=-1;render()}
function home(){if(busy)return t('Дождитесь окончания');tab='cases';oc=-1;Q='';render();scrollTo(0,0)}
function login(){if(!/^https?:$/.test(location.protocol))return t('Вход через Steam работает, когда сайт открыт по http(s), а не как файл');const r=location.origin+location.pathname,ns='http://specs.openid.net/auth/2.0';
location.href='https://steamcommunity.com/openid/login?'+new URLSearchParams({'openid.ns':ns,'openid.mode':'checkid_setup','openid.return_to':r,'openid.realm':location.origin,'openid.identity':ns+'/identifier_select','openid.claimed_id':ns+'/identifier_select'})}

up:()=>`<h2 class="ut">МОДЕРНИЗАЦИЯ ОРУЖИЯ</h2><div id="u1">${u1()}</div>
<div class="ug"><div class="up-p slid"><span>Добавить баланс</span><input type="range" min="0" max="${Math.floor(S.bal)}" value="${up.add}" oninput="up.add=+this.value;ref()"><b id="sv">${f(up.add)}</b></div><div class="c"><button class="btn big" onclick="upg()">⬆ ПРОКАЧАТЬ</button></div><div class="row mlt">${[2,5,10].map(m=>`<button class="chip" onclick="setM(${m})">x${m}</button>`).join('')}${[30,50,75].map(p=>`<button class="chip" onclick="setP(${p})">${p}%</button>`).join('')}<button class="chip" onclick="shuf()">🔀</button></div></div>
<div class="lists"><div class="up-p"><h4>Мои предметы (${S.inv.length} шт)</h4><div class="list scroll" id="mi">${mil()}</div></div><div class="up-p"><div class="flt"><b>Выберите предмет</b><select onchange="up.k=this.value;up.n=60;ref()">${[['w','Скины'],['k','Ножи и перчатки'],['t','Стикеры'],['','Всё']].map(o=>`<option value="${o[0]}" ${up.k==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><select onchange="up.s=this.value;up.n=60;ref()"><option value="a">Цена ↑</option><option value="d" ${up.s=='d'?'selected':''}>Цена ↓</option></select><input type="number" placeholder="от ₴" value="${up.lo}" oninput="up.lo=this.value;up.n=60;ref()"><input type="number" placeholder="до ₴" value="${up.hi}" oninput="up.hi=this.value;up.n=60;ref()"><input placeholder="Поиск" value="${up.q}" oninput="up.q=this.value;up.n=60;ref()"></div><div class="list scroll" id="tg">${tgl()}</div></div></div>`,
inv:()=>`<div class="pan"><h3>Инвентарь · ${f(S.inv.reduce((s,x)=>s+x.p,0))} ${S.inv.length?'<button class="btn sm" onclick="sellAll()">Продать всё</button>':''}</h3><div class="list">${S.inv.length?S.inv.map((x,i)=>`<div class="c">${card(x)}<button class="btn sm" onclick="sell(${i})">Продать</button></div>`).join(''):'<p style="color:var(--mu)">Пока пусто.</p>'}</div></div>`};
const TK=Array.from({length:72},(_,i)=>{const a=i*5*Math.PI/180,l=i%6==0?10:5,s=Math.sin(a),c=Math.cos(a);return`<line x1="${150+s*118}" y1="${150-c*118}" x2="${150+s*(118+l)}" y2="${150-c*(118+l)}"/>`}).join('');

<div class="dial"><svg viewBox="0 0 300 300"><g stroke="rgba(255,255,255,.28)" stroke-width="2">${TK}</g><circle cx="150" cy="150" r="98" fill="none" stroke="#262932" stroke-width="16"/><circle cx="150" cy="150" r="98" fill="none" stroke="#e9ebf1" stroke-width="16" stroke-dasharray="${ch/100*L} ${L}" transform="rotate(-90 150 150)" style="filter:drop-shadow(0 0 6px #fff)"/><defs><radialGradient id="dg"><stop offset="0" stop-color="#2d2f39"/><stop offset="1" stop-color="#121317"/></radialGradient></defs><circle cx="150" cy="150" r="78" fill="url(#dg)"/><g id="pt"><path d="M150 68L139 42H161Z" fill="#fff" style="filter:drop-shadow(0 0 5px #fff)"/></g><text x="150" y="152" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">${ch.toFixed(2)}%</text><text x="150" y="174" fill="#8d93a1" font-size="12" text-anchor="middle">шанс</text></svg></div>
<div class="up-p c"><div class="hd">Выберите оружие, которое хотите получить</div>${up.tg?`<div class="sg one">${card(up.tg)}</div><div class="sm">Цена: <b>${f(up.tg.p)}</b></div>`:'<div class="ph">Выберите предмет из каталога или нажмите множитель</div>'}</div></div>`}

const L=cat().filter(x=>(!up.k||x.k==up.k)&&x.p>=lo&&x.p<=hi&&((x.n+' '+(x.e||'')).toLowerCase().includes(q)));if(up.s=='d')L.reverse();const m=up.n||60;window.TL=L.slice(0,m);

}catch(e){L.innerHTML='Не удалось загрузить данные. Откройте файл в браузере с доступом в интернет или разместите его на своём хостинге.<br><br><button class="btn" onclick="location.reload()">Повторить</button>'}}
