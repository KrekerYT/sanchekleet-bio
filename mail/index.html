<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanchek Mail</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#121212; --panel2:#181818; --line:#232323;
    --text:#ececec; --muted:#8a8a8a; --accent:#9ecbff; --danger:#ff6b6b; --ok:#5fd38d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  a{color:var(--accent)}

  /* вход */
  #auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
  .card h1{margin:0 0 4px;font-size:22px}
  .card p.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:var(--panel2);color:var(--text);border-color:#333}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,textarea:focus{border-color:#3d5a80}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid #2f4d6e;background:#1d3550;cursor:pointer}
  .btn:hover{background:#244265}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn.ghost:hover{background:var(--panel2)}
  .btn.full{width:100%;margin-top:18px}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px}
  .domainhint{color:var(--muted);font-size:12px;margin-top:4px}

  /* приложение */
  #app{height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .logo{font-weight:700;letter-spacing:.5px}
  header .me{margin-left:auto;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{flex:1;display:flex;min-height:0}
  nav{width:190px;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
  nav .folder{padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between}
  nav .folder.on{background:var(--panel2);color:var(--text)}
  nav .folder:hover{background:var(--panel2)}
  #list{width:360px;border-right:1px solid var(--line);overflow-y:auto}
  .row{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#101010}
  .row.on{background:var(--panel2)}
  .row .top{display:flex;justify-content:space-between;gap:10px}
  .row .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .dt{color:var(--muted);font-size:12px;white-space:nowrap}
  .row .sj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sn{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.unread .who,.row.unread .sj{color:#fff}
  .row.unread .who::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px}
  .row:not(.unread) .sj{color:#b5b5b5}
  #reader{flex:1;min-width:0;display:flex;flex-direction:column}
  #readerEmpty{margin:auto;color:var(--muted)}
  #readerBody{display:flex;flex-direction:column;min-height:0;flex:1}
  .rhead{padding:14px 18px;border-bottom:1px solid var(--line)}
  .rhead h2{margin:0 0 6px;font-size:18px;word-break:break-word}
  .rhead .meta{color:var(--muted);font-size:13px;word-break:break-word}
  .rhead .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .rhead .acts .btn{padding:6px 12px;font-size:13px}
  #frame{flex:1;width:100%;border:0;background:#fff}
  #textBody{flex:1;overflow:auto;padding:16px 18px;white-space:pre-wrap;word-break:break-word}
  .atts{padding:8px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .more{padding:12px;text-align:center}

  /* письмо */
  #compose{position:fixed;right:18px;bottom:18px;width:460px;max-width:calc(100vw - 20px);background:var(--panel);border:1px solid #333;border-radius:14px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:20}
  #compose .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  #compose textarea{min-height:200px;resize:vertical}
  #compose .ca{display:flex;gap:8px;align-items:center;margin-top:12px}
  #compose .st{font-size:13px;color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:10px 16px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}

  @media (max-width:860px){
    nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px}
    main{flex-direction:column}
    #list{width:100%;border-right:0;max-height:40%}
    .rm-mobile{display:none}
  }
</style>
</head>
<body>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<div id="auth">
  <div class="card">
    <h1>Sanchek Mail</h1>
    <p class="sub">Своя почта на своём домене</p>
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">Вход</button>
      <button id="tabReg" type="button">Регистрация</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label for="fUser">Имя ящика</label>
      <input id="fUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <div class="domainhint" id="addrHint"></div>
      <label for="fPass" id="lPass">Пароль</label>
      <input id="fPass" name="password" type="password" autocomplete="current-password" required>
      <div id="regOnly" class="hidden">
        <label for="fCode">Пароль для регистрации</label>
        <input id="fCode" name="code" type="password" autocomplete="off">
        <div class="domainhint">Его знает только владелец сервиса</div>
      </div>
      <div class="err" id="authErr"></div>
      <button class="btn full" id="authBtn" type="submit">Войти</button>
    </form>
  </div>
</div>

<!-- ПОЧТА -->
<div id="app" class="hidden">
  <header>
    <span class="logo">✉ Sanchek Mail</span>
    <button class="btn" id="btnCompose" type="button">Написать</button>
    <button class="btn ghost" id="btnRefresh" type="button">Обновить</button>
    <span class="me" id="meAddr"></span>
    <button class="btn ghost" id="btnLogout" type="button">Выйти</button>
  </header>
  <main>
    <nav>
      <div class="folder on" data-folder="inbox">Входящие <span id="unreadCnt"></span></div>
      <div class="folder" data-folder="sent">Отправленные</div>
    </nav>
    <div id="list"></div>
    <section id="reader">
      <div id="readerEmpty">Выбери письмо</div>
      <div id="readerBody" class="hidden">
        <div class="rhead">
          <h2 id="rSubject"></h2>
          <div class="meta" id="rMeta"></div>
          <div class="acts">
            <button class="btn ghost" id="btnReply" type="button">Ответить</button>
            <button class="btn ghost" id="btnImg" type="button">Показать картинки</button>
            <button class="btn ghost" id="btnDel" type="button">Удалить</button>
          </div>
        </div>
        <iframe id="frame" class="hidden" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
        <div id="textBody" class="hidden"></div>
        <div class="atts hidden" id="rAtts"></div>
      </div>
    </section>
  </main>
</div>

<!-- НОВОЕ ПИСЬМО -->
<div id="compose" class="hidden">
  <div class="ch"><b>Новое письмо</b><button class="btn ghost" id="cClose" type="button" style="padding:3px 10px">×</button></div>
  <label for="cTo">Кому (через запятую)</label>
  <input id="cTo" autocapitalize="none" spellcheck="false">
  <label for="cSubj">Тема</label>
  <input id="cSubj">
  <label for="cText">Текст</label>
  <textarea id="cText"></textarea>
  <div class="ca">
    <button class="btn" id="cSend" type="button">Отправить</button>
    <span class="st" id="cStatus"></span>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // Если интерфейс лежит не там же, где воркер, впиши адрес воркера, например:
  // const API = "https://sanchek-mail.твой-ник.workers.dev";
  const API = "https://sanchek-mail.easyhubapi.workers.dev";

  const $ = (id) => document.getElementById(id);
  const state = { token: localStorage.getItem("sm_token") || "", user: "", address: "",
                  folder: "inbox", cursor: null, current: null, showImages: false, mode: "login" };

  /* ---------- сеть ---------- */
  async function api(path, opts) {
    opts = opts || {};
    const headers = { "Content-Type": "application/json" };
    if (state.token) headers.Authorization = "Bearer " + state.token;
    const res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (res.status === 401 && state.token && !path.startsWith("/api/login")) { logoutLocal(); }
    if (!res.ok) throw new Error(data.error || ("Ошибка " + res.status));
    return data;
  }

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2500);
  }

  /* ---------- вход / регистрация ---------- */
  function setMode(mode) {
    state.mode = mode;
    $("tabLogin").classList.toggle("on", mode === "login");
    $("tabReg").classList.toggle("on", mode === "reg");
    $("regOnly").classList.toggle("hidden", mode !== "reg");
    $("fCode").required = mode === "reg";
    $("fPass").autocomplete = mode === "reg" ? "new-password" : "current-password";
    $("lPass").textContent = mode === "reg" ? "Придумай пароль ящика (от 8 символов)" : "Пароль";
    $("authBtn").textContent = mode === "reg" ? "Создать ящик" : "Войти";
    $("authErr").textContent = "";
  }
  $("tabLogin").onclick = function () { setMode("login"); };
  $("tabReg").onclick = function () { setMode("reg"); };

  $("authForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("authErr").textContent = "";
    $("authBtn").disabled = true;
    try {
      const body = { username: $("fUser").value.trim().toLowerCase(), password: $("fPass").value };
      if (state.mode === "reg") body.code = $("fCode").value;
      const r = await api(state.mode === "reg" ? "/api/register" : "/api/login", { method: "POST", body: body });
      state.token = r.token; localStorage.setItem("sm_token", r.token);
      $("fPass").value = ""; $("fCode").value = "";
      await enterApp();
    } catch (err) {
      $("authErr").textContent = err.message;
    } finally {
      $("authBtn").disabled = false;
    }
  });

  function logoutLocal() {
    state.token = ""; localStorage.removeItem("sm_token");
    $("app").classList.add("hidden"); $("auth").classList.remove("hidden");
  }
  $("btnLogout").onclick = async function () {
    try { await api("/api/logout", { method: "POST" }); } catch (e) {}
    logoutLocal();
  };

  async function enterApp() {
    const me = await api("/api/me");
    state.user = me.username; state.address = me.address;
    $("meAddr").textContent = me.address;
    $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
    $("addrHint").textContent = "";
    await loadList(true);
  }

  /* ---------- список писем ---------- */
  function fmtDate(iso) {
    const d = new Date(iso); if (isNaN(d)) return "";
    const now = new Date();
    return d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit" });
  }

  async function loadList(reset) {
    const list = $("list");
    if (reset) { state.cursor = null; list.textContent = ""; }
    const q = "/api/messages?folder=" + state.folder + (state.cursor ? "&cursor=" + encodeURIComponent(state.cursor) : "");
    let r;
    try { r = await api(q); } catch (e) { toast(e.message); return; }
    const old = list.querySelector(".more"); if (old) old.remove();

    if (reset && !r.items.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = state.folder === "inbox" ? "Писем пока нет" : "Ничего не отправлено";
      list.appendChild(d);
    }
    r.items.forEach(function (it) {
      const row = document.createElement("div");
      row.className = "row" + (it.read === false ? " unread" : "");
      row.dataset.id = it.id;
      const top = document.createElement("div"); top.className = "top";
      const who = document.createElement("span"); who.className = "who"; who.textContent = it.who || "";
      const dt = document.createElement("span"); dt.className = "dt"; dt.textContent = fmtDate(it.date);
      top.append(who, dt);
      const sj = document.createElement("div"); sj.className = "sj"; sj.textContent = it.subject || "(без темы)";
      const sn = document.createElement("div"); sn.className = "sn"; sn.textContent = it.snippet || "";
      row.append(top, sj, sn);
      row.onclick = function () { openMessage(it.id, row); };
      list.appendChild(row);
    });
    state.cursor = r.cursor;
    if (r.cursor) {
      const more = document.createElement("div"); more.className = "more";
      const b = document.createElement("button"); b.className = "btn ghost"; b.textContent = "Ещё";
      b.onclick = function () { loadList(false); };
      more.appendChild(b); list.appendChild(more);
    }
    updateUnread();
  }

  function updateUnread() {
    const n = document.querySelectorAll("#list .row.unread").length;
    $("unreadCnt").textContent = state.folder === "inbox" && n ? "(" + n + (state.cursor ? "+" : "") + ")" : "";
  }

  document.querySelectorAll("nav .folder").forEach(function (el) {
    el.onclick = function () {
      document.querySelectorAll("nav .folder").forEach(function (x) { x.classList.remove("on"); });
      el.classList.add("on"); state.folder = el.dataset.folder;
      closeReader(); loadList(true);
    };
  });
  $("btnRefresh").onclick = function () { loadList(true); };

  /* ---------- чтение письма ---------- */
  function closeReader() {
    state.current = null;
    $("readerBody").classList.add("hidden"); $("readerEmpty").classList.remove("hidden");
  }

  function addrStr(a) { return a.name ? a.name + " <" + a.address + ">" : a.address; }

  async function openMessage(id, row) {
    let m;
    try { m = await api("/api/messages/" + id + "?folder=" + state.folder); }
    catch (e) { toast(e.message); return; }
    state.current = m; state.showImages = false;
    document.querySelectorAll("#list .row").forEach(function (r) { r.classList.remove("on"); });
    if (row) { row.classList.add("on"); row.classList.remove("unread"); updateUnread(); }

    $("rSubject").textContent = m.subject || "(без темы)";
    const meta = "От: " + addrStr(m.from) + "\nКому: " + (m.to || []).map(addrStr).join(", ") +
      ((m.cc || []).length ? "\nКопия: " + m.cc.map(addrStr).join(", ") : "") +
      "\n" + new Date(m.date).toLocaleString("ru-RU");
    $("rMeta").style.whiteSpace = "pre-line"; $("rMeta").textContent = meta;
    $("btnReply").classList.toggle("hidden", state.folder === "sent");
    $("btnImg").classList.toggle("hidden", !m.html);
    $("btnImg").textContent = "Показать картинки";
    renderBody();

    const at = $("rAtts");
    if ((m.attachments || []).length) {
      at.textContent = "Вложения (не сохраняются): " + m.attachments.map(function (a) { return a.filename; }).join(", ");
      at.classList.remove("hidden");
    } else at.classList.add("hidden");

    $("readerEmpty").classList.add("hidden"); $("readerBody").classList.remove("hidden");
  }

  function renderBody() {
    const m = state.current, fr = $("frame"), tb = $("textBody");
    if (m.html) {
      // HTML показываем только в изолированном iframe: без скриптов, без доступа к странице
      const img = state.showImages ? "https: data:" : "data:";
      const doc = '<!doctype html><meta charset="utf-8">' +
        '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src ' + img + '; style-src \'unsafe-inline\'">' +
        '<base target="_blank"><style>body{font:14px/1.5 sans-serif;margin:16px;word-break:break-word}img{max-width:100%;height:auto}</style>' + m.html;
      fr.srcdoc = doc; fr.classList.remove("hidden"); tb.classList.add("hidden");
    } else {
      tb.textContent = m.text || ""; tb.classList.remove("hidden"); fr.classList.add("hidden"); fr.srcdoc = "";
    }
  }

  $("btnImg").onclick = function () {
    state.showImages = !state.showImages;
    $("btnImg").textContent = state.showImages ? "Скрыть картинки" : "Показать картинки";
    renderBody();
  };

  $("btnDel").onclick = async function () {
    if (!state.current || !confirm("Удалить письмо?")) return;
    try {
      await api("/api/messages/" + state.current.id + "?folder=" + state.folder, { method: "DELETE" });
      closeReader(); loadList(true); toast("Удалено");
    } catch (e) { toast(e.message); }
  };

  /* ---------- написать / ответить ---------- */
  function openCompose(to, subject, text) {
    $("cTo").value = to || ""; $("cSubj").value = subject || ""; $("cText").value = text || "";
    $("cStatus").textContent = ""; $("compose").classList.remove("hidden");
    (to ? $("cText") : $("cTo")).focus();
  }
  $("btnCompose").onclick = function () { openCompose(); };
  $("cClose").onclick = function () { $("compose").classList.add("hidden"); };

  $("btnReply").onclick = function () {
    const m = state.current; if (!m) return;
    const subj = /^(re|ответ):/i.test(m.subject || "") ? m.subject : "Re: " + (m.subject || "");
    const quoted = "\n\n" + new Date(m.date).toLocaleString("ru-RU") + ", " + addrStr(m.from) + " писал(а):\n" +
      (m.text || "").split("\n").map(function (l) { return "> " + l; }).join("\n");
    openCompose(m.from.address, subj, quoted);
    const t = $("cText"); t.setSelectionRange(0, 0);
  };

  $("cSend").onclick = async function () {
    $("cSend").disabled = true; $("cStatus").textContent = "Отправляю…";
    try {
      await api("/api/send", { method: "POST", body: {
        to: $("cTo").value, subject: $("cSubj").value, text: $("cText").value } });
      $("compose").classList.add("hidden"); toast("Отправлено");
      if (state.folder === "sent") loadList(true);
    } catch (e) { $("cStatus").textContent = e.message; $("cStatus").style.color = "var(--danger)"; }
    finally { $("cSend").disabled = false; }
  };

  /* ---------- старт ---------- */
  $("fUser").addEventListener("input", function () {
    const v = $("fUser").value.trim().toLowerCase();
    $("addrHint").textContent = "";
    if (state.mode === "reg" && /^[a-z0-9][a-z0-9._-]{2,31}$/.test(v)) {
      clearTimeout(this._t);
      this._t = setTimeout(async function () {
        try {
          const r = await api("/api/check-status?username=" + encodeURIComponent(v));
          $("addrHint").textContent = r.status === "taken" ? "Имя занято" : "Имя свободно";
        } catch (e) {}
      }, 400);
    }
  });

  setInterval(function () { if (state.token && !document.hidden && state.folder === "inbox" && $("app") && !$("app").classList.contains("hidden")) loadList(true); }, 60000);

  if (state.token) enterApp().catch(logoutLocal);
})();
</script>
</body>
</html>
