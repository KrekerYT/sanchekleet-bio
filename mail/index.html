<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S mail // Sanchek Ecosystem</title>
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #0a0a0a;
            --surface-glass: rgba(12, 12, 12, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-main: #f3f3f3;
            --text-muted: #737373;
            --accent: #ffffff;
            --accent-dim: #1a1a1a;
            --danger: #ff453a;
            --success: #32d74b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .screen {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            position: absolute;
            display: none;
        }

        .auth-card {
            width: 420px;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-field-wrapper {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-field-wrapper:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 14px 0;
        }

        .input-suffix {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
            white-space: nowrap;
            padding-left: 4px;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .switch-auth-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .switch-auth-mode span {
            color: var(--accent);
            font-weight: 500;
            text-decoration: underline;
        }

        .switch-auth-mode:hover {
            color: var(--text-main);
        }

        .reg-only {
            display: none;
        }
        .reg-only.active {
            display: block;
        }

        /* Dashboard Layout */
        .dashboard-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            background: var(--bg-color);
        }

        .sidebar {
            width: 260px;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span {
            font-size: 0.75rem;
            background: var(--accent-dim);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .compose-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 24px;
            transition: opacity 0.2s;
        }
        .compose-btn:hover { opacity: 0.9; }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .user-profile-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-profile-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .logout-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(255, 69, 58, 0.2);
            border-radius: 6px;
            padding: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255, 69, 58, 0.1);
        }

        .main-workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .search-bar {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 16px;
            width: 320px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
        }

        .mail-list {
            width: 380px;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .mail-item {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .mail-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .mail-item.active {
            background: rgba(255, 255, 255, 0.05);
        }

        .mail-sender {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .mail-subject {
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mail-snippet {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mail-reader {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .reader-header {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .reader-subject {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .reader-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .reader-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d1d1d1;
        }

        /* Compose Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .compose-card {
            width: 500px;
            background: var(--surface-glass);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        .compose-card h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .compose-textarea {
            width: 100%;
            height: 120px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            resize: none;
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- ЭКРАН АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
    <div id="authScreen" class="screen">
        <div class="auth-card">
            <div class="brand-header">
                <div class="brand-logo">S</div>
                <div class="brand-subtitle" id="formTitle">Secure Login</div>
            </div>

            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="text" id="userInput" class="input-field" placeholder="username" autocomplete="off" spellcheck="false">
                    <span class="input-suffix">@sanchek.de</span>
                </div>
            </div>

            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="password" id="passInput" class="input-field" placeholder="Пароль" autocomplete="current-password">
                </div>
            </div>

            <div class="input-group reg-only" id="regKeyGroup">
                <div class="input-field-wrapper">
                    <input type="password" id="regKeyInput" class="input-field" placeholder="Секретный ключ (mailreg)">
                </div>
            </div>

            <button class="btn" id="actionBtn" onclick="handleAuthAction()">Войти</button>

            <div class="switch-auth-mode" id="switchModeText" onclick="toggleMode()">
                Нет аккаунта? <span>Создать</span>
            </div>
        </div>
    </div>

    <!-- ДАШБОРД -->
    <div id="dashboardScreen" class="screen hidden">
        <div class="dashboard-container">
            <div class="sidebar">
                <div class="sidebar-brand">
                    S mail <span>@sanchek.de</span>
                </div>
                <button class="compose-btn" onclick="openComposeModal()">+ Написать письмо</button>
                <ul class="nav-list">
                    <li class="nav-item active" onclick="switchFolder('inbox', this)">Входящие</li>
                    <li class="nav-item" onclick="switchFolder('sent', this)">Отправленные</li>
                    <li class="nav-item" onclick="switchFolder('drafts', this)">Черновики</li>
                    <li class="nav-item" onclick="switchFolder('trash', this)">Корзина</li>
                </ul>
                <div class="user-profile-footer">
                    <div class="user-profile-badge" id="userBadge">user@sanchek.de</div>
                    <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
                </div>
            </div>

            <div class="main-workspace">
                <div class="topbar">
                    <input type="text" class="search-bar" placeholder="Поиск по сообщениям..." oninput="filterMails(this.value)">
                </div>
                <div class="content-area">
                    <div class="mail-list" id="mailListContainer">
                        <!-- Список писем рендерится через JS -->
                    </div>
                    <div class="mail-reader" id="mailReader">
                        <div class="reader-header">
                            <div class="reader-subject">Выберите письмо</div>
                            <div class="reader-meta">—</div>
                        </div>
                        <div class="reader-body">
                            Нажмите на любое письмо в списке слева, чтобы прочитать его содержимое.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НАПИСАТЬ ПИСЬМО -->
    <div class="modal-overlay" id="composeModal">
        <div class="compose-card">
            <h3>Новое сообщение</h3>
            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="text" id="composeTo" class="input-field" placeholder="Получатель (например: support@roblox.com)">
                </div>
            </div>
            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="text" id="composeSubject" class="input-field" placeholder="Тема письма">
                </div>
            </div>
            <textarea id="composeBody" class="compose-textarea" placeholder="Текст сообщения..."></textarea>
            <div class="modal-actions">
                <button class="btn" style="margin-top:0;" onclick="sendMail()">Отправить</button>
                <button class="btn" style="margin-top:0; background:var(--surface-color); color:var(--text-main); border:1px solid var(--border-color);" onclick="closeComposeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = null;
        let currentFolder = 'inbox';
        let activeMailId = null;

        // База писем в памяти (хранится в localStorage для каждого юзера)
        let sampleInbox = [
            { id: 1, folder: 'inbox', sender: 'Cloudflare Security', subject: 'DNS Propagation Complete', time: 'Сегодня, 03:32', body: 'Привет!<br><br>Твой домен <b>sanchek.de</b> успешно активирован в системе Cloudflare Email Routing.<br><br>— Команда инфраструктуры Sanchek' },
            { id: 2, folder: 'inbox', sender: 'Roblox Verification', subject: 'Your Roblox security code', time: 'Вчера, 19:12', body: 'Hello,<br><br>Your verification code is: <b>839-201</b>. Do not share this code with anyone.<br><br>— Roblox Team' }
        ];

        // Проверка при загрузке страницы: если юзер уже входил — сразу открываем почту
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('logged_user');
            if (savedUser) {
                currentUser = savedUser;
                showDashboard();
            }
        });

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('formTitle');
            const btn = document.getElementById('actionBtn');
            const switchText = document.getElementById('switchModeText');
            const regKeyGroup = document.getElementById('regKeyGroup');

            if (isRegisterMode) {
                title.innerText = "New Account";
                btn.innerText = "Зарегистрировать";
                switchText.innerHTML = "Уже есть аккаунт? <span>Войти</span>";
                regKeyGroup.classList.add('active');
            } else {
                title.innerText = "Secure Login";
                btn.innerText = "Войти";
                switchText.innerHTML = "Нет аккаунта? <span>Создать</span>";
                regKeyGroup.classList.remove('active');
            }
        }

        function handleAuthAction() {
            const user = document.getElementById('userInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;

            if (!user || !pass) {
                alert("Заполни все поля!");
                return;
            }

            if (isRegisterMode) {
                const regKey = document.getElementById('regKeyInput').value;
                if (regKey !== "mailreg") {
                    alert("Неверный секретный ключ регистрации (нужен mailreg)!");
                    return;
                }

                if (localStorage.getItem(`pass_${user}`)) {
                    alert("Такой ящик уже существует!");
                    return;
                }

                localStorage.setItem(`pass_${user}`, pass);
                alert("Почта создана! Теперь войди в нее.");
                toggleMode();
            } else {
                const savedPass = localStorage.getItem(`pass_${user}`);
                if (!savedPass || savedPass !== pass) {
                    alert("Неверный логин или пароль!");
                    return;
                }

                currentUser = `${user}@sanchek.de`;
                localStorage.setItem('logged_user', currentUser);
                showDashboard();
            }
        }

        function logout() {
            localStorage.removeItem('logged_user');
            currentUser = null;
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('userBadge').innerText = currentUser;
            loadMails();
        }

        // Управление папками
        function switchFolder(folder, element) {
            currentFolder = folder;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            loadMails();
        }

        function getMails() {
            const key = `mails_${currentUser}`;
            let data = localStorage.getItem(key);
            if (!data) {
                // Инициализируем стартовыми письмами для нового юзера
                localStorage.setItem(key, JSON.stringify(sampleInbox));
                return sampleInbox;
            }
            return JSON.parse(data);
        }

        function saveMails(mails) {
            localStorage.setItem(`mails_${currentUser}`, JSON.stringify(mails));
        }

        function loadMails(searchQuery = '') {
            const container = document.getElementById('mailListContainer');
            const mails = getMails().filter(m => m.folder === currentFolder);

            const filtered = mails.filter(m => 
                m.sender.toLowerCase().includes(searchQuery.toLowerCase()) || 
                m.subject.toLowerCase().includes(searchQuery.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Папка пуста</div>`;
                return;
            }

            container.innerHTML = filtered.map(m => `
                <div class="mail-item ${activeMailId === m.id ? 'active' : ''}" onclick="openMail(${m.id})">
                    <div class="mail-sender">${m.sender}</div>
                    <div class="mail-subject">${m.subject}</div>
                    <div class="mail-snippet">${m.body.replace(/<[^>]*>?/gm, '')}</div>
                </div>
            `).join('');
        }

        function openMail(id) {
            activeMailId = id;
            const mails = getMails();
            const mail = mails.find(m => m.id === id);
            if (!mail) return;

            loadMails(); // Обновляем подсветку активного

            document.getElementById('mailReader').innerHTML = `
                <div class="reader-header">
                    <div class="reader-subject">${mail.subject}</div>
                    <div class="reader-meta">От: ${mail.sender} • ${mail.time}</div>
                </div>
                <div class="reader-body">
                    ${mail.body}
                </div>
            `;
        }

        function filterMails(query) {
            loadMails(query);
        }

        // Модалка создания письма
        function openComposeModal() {
            document.getElementById('composeModal').classList.add('active');
        }

        function closeComposeModal() {
            document.getElementById('composeModal').classList.remove('active');
            document.getElementById('composeTo').value = '';
            document.getElementById('composeSubject').value = '';
            document.getElementById('composeBody').value = '';
        }

        function sendMail() {
            const to = document.getElementById('composeTo').value.trim();
            const subject = document.getElementById('composeSubject').value.trim();
            const body = document.getElementById('composeBody').value.trim();

            if (!to || !subject || !body) {
                alert("Заполни все поля письма!");
                return;
            }

            const mails = getMails();
            const newMail = {
                id: Date.now(),
                folder: 'sent',
                sender: to,
                subject: subject,
                time: 'Только что',
                body: body.replace(/\n/g, '<br>')
            };

            mails.unshift(newMail);
            saveMails(mails);
            closeComposeModal();
            alert("Письмо успешно отправлено!");

            if (currentFolder === 'sent') {
                loadMails();
            }
        }
    </script>
</body>
</html>
