<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S mail // Cyberpunk Ecosystem</title>
    <style>
        :root {
            --bg-color: #030305;
            --surface-color: rgba(12, 12, 16, 0.75);
            --surface-glass: rgba(18, 18, 24, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.25);
            --text-main: #f4f4f6;
            --text-muted: #8a8a93;
            --accent-glow: rgba(0, 240, 255, 0.15);
            --accent-border: rgba(0, 240, 255, 0.4);
            --accent-main: #00f0ff;
            --danger: #ff3366;
            --success: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.04) 0%, transparent 40%);
        }

        .ambient-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        .screen {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            position: absolute;
            display: none;
        }

        .auth-card {
            width: 420px;
            background: var(--surface-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--text-main);
            text-shadow: 0 0 20px var(--accent-border);
            line-height: 1;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-field-wrapper {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 16px;
            transition: all 0.25s ease;
        }

        .input-field-wrapper:focus-within {
            border-color: var(--accent-border);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 14px 0;
        }

        .input-suffix {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
            white-space: nowrap;
            padding-left: 4px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffffff, #dcdce1);
            color: #050508;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .switch-auth-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .switch-auth-mode span {
            color: var(--text-main);
            font-weight: 600;
            text-decoration: underline;
        }

        .reg-only { display: none; }
        .reg-only.active { display: block; }

        /* Dashboard Layout с Glassmorphism */
        .dashboard-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            background: var(--bg-color);
        }

        .sidebar {
            width: 270px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .compose-btn {
            background: linear-gradient(135deg, var(--text-main), var(--text-muted));
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .compose-btn:hover { transform: translateY(-1px); }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border-left: 3px solid var(--accent-main);
        }

        .user-profile-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-profile-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .logout-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: rgba(255, 51, 102, 0.15); }

        .main-workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .topbar {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: var(--surface-glass);
            backdrop-filter: blur(10px);
        }

        .topbar-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-bar {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px;
            width: 320px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus { border-color: var(--accent-border); }

        .refresh-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent-border);
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
        }

        .mail-list {
            width: 380px;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            background: rgba(5,5,8,0.4);
        }

        .mail-item {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .mail-item:hover { background: rgba(255, 255, 255, 0.03); }
        .mail-item.active { background: rgba(255, 255, 255, 0.07); border-left: 3px solid var(--accent-main); }

        .mail-sender { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
        .mail-subject { font-size: 0.9rem; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mail-snippet { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .mail-reader {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-color);
        }

        .reader-header {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .reader-subject { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .reader-meta { font-size: 0.85rem; color: var(--text-muted); }
        .reader-body { font-size: 0.95rem; line-height: 1.6; color: #d1d1d6; }

        /* Кастом панель настроек */
        .custom-panel {
            padding: 30px;
            max-width: 600px;
        }
        .custom-panel h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .custom-section { margin-bottom: 20px; }
        .custom-section label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .color-pickers { display: flex; gap: 15px; }
        .color-pickers input[type="color"] {
            background: none; border: 1px solid var(--border-color); width: 50px; height: 40px; border-radius: 8px; cursor: pointer;
        }

        /* Модалка отправки */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .compose-card {
            width: 500px; background: var(--surface-glass); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            backdrop-filter: blur(25px);
        }
        .compose-card h3 { margin-bottom: 20px; font-size: 1.2rem; }
        .compose-textarea {
            width: 100%; height: 120px; background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 12px; color: var(--text-main); font-size: 0.9rem; outline: none; resize: none; margin-bottom: 16px;
        }
        .modal-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="authScreen" class="screen">
        <div class="auth-card">
            <div class="brand-header">
                <div class="brand-logo">S</div>
                <div class="brand-subtitle" id="formTitle">Secure Login</div>
            </div>

            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="text" id="userInput" class="input-field" placeholder="username" autocomplete="off" spellcheck="false">
                    <span class="input-suffix">@sanchek.de</span>
                </div>
            </div>

            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="password" id="passInput" class="input-field" placeholder="Пароль" autocomplete="current-password">
                </div>
            </div>

            <div class="input-group reg-only" id="regKeyGroup">
                <div class="input-field-wrapper">
                    <input type="password" id="regKeyInput" class="input-field" placeholder="Секретный ключ (mailreg)">
                </div>
            </div>

            <button class="btn" id="actionBtn" onclick="handleAuthAction()">Войти</button>

            <div class="switch-auth-mode" id="switchModeText" onclick="toggleMode()">
                Нет аккаунта? <span>Создать</span>
            </div>
        </div>
    </div>

    <!-- ДАШБОРД -->
    <div id="dashboardScreen" class="screen hidden">
        <div class="dashboard-container">
            <div class="sidebar">
                <div class="sidebar-brand">
                    S mail <span>@sanchek.de</span>
                </div>
                <button class="compose-btn" onclick="openComposeModal()">+ Написать письмо</button>
                <ul class="nav-list" id="navList">
                    <li class="nav-item active" onclick="switchFolder('inbox', this)">Входящие</li>
                    <li class="nav-item" onclick="switchFolder('sent', this)">Отправленные</li>
                    <li class="nav-item" onclick="switchFolder('drafts', this)">Черновики</li>
                    <li class="nav-item" onclick="switchFolder('trash', this)">Корзина</li>
                    <li class="nav-item" onclick="switchFolder('custom', this)" style="margin-top: auto; border-top: 1px solid var(--border-color); color: var(--accent-main);">⚙️ КАСТОМ</li>
                </ul>
                <div class="user-profile-footer">
                    <div class="user-profile-badge" id="userBadge">user@sanchek.de</div>
                    <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
                </div>
            </div>

            <div class="main-workspace">
                <div class="topbar">
                    <input type="text" class="search-bar" placeholder="Поиск по сообщениям..." oninput="filterMails(this.value)">
                    <div class="topbar-actions">
                        <button class="refresh-btn" onclick="refreshInbox()">🔄 Обновить</button>
                    </div>
                </div>
                <div class="content-area" id="mainContentArea">
                    <div class="mail-list" id="mailListContainer"></div>
                    <div class="mail-reader" id="mailReader">
                        <div class="reader-header">
                            <div class="reader-subject">Выберите письмо</div>
                            <div class="reader-meta">—</div>
                        </div>
                        <div class="reader-body">Нажмите на письмо в списке слева.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НАПИСАТЬ ПИСЬМО -->
    <div class="modal-overlay" id="composeModal">
        <div class="compose-card">
            <h3>Новое сообщение</h3>
            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="text" id="composeTo" class="input-field" placeholder="Получатель (например: roblox@support.com)">
                </div>
            </div>
            <div class="input-group">
                <div class="input-field-wrapper">
                    <input type="text" id="composeSubject" class="input-field" placeholder="Тема письма">
                </div>
            </div>
            <textarea id="composeBody" class="compose-textarea" placeholder="Текст сообщения..."></textarea>
            <div class="modal-actions">
                <button class="btn" style="margin-top:0;" onclick="sendMail()">Отправить</button>
                <button class="btn" style="margin-top:0; background:var(--surface-color); color:var(--text-main); border:1px solid var(--border-color);" onclick="closeComposeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = null;
        let currentFolder = 'inbox';
        let activeMailId = null;

        let sampleInbox = [
            { id: 1, folder: 'inbox', sender: 'Cloudflare Security', subject: 'DNS Propagation Complete', time: 'Сегодня, 03:32', body: 'Твой домен <b>sanchek.de</b> успешно активирован.' },
            { id: 2, folder: 'inbox', sender: 'Roblox Verification', subject: 'Your Roblox security code', time: 'Вчера, 19:12', body: 'Verification code: <b>992-104</b>' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('logged_user');
            if (savedUser) {
                currentUser = savedUser;
                showDashboard();
            }
            loadTheme();
        });

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('formTitle');
            const btn = document.getElementById('actionBtn');
            const switchText = document.getElementById('switchModeText');
            const regKeyGroup = document.getElementById('regKeyGroup');

            if (isRegisterMode) {
                title.innerText = "New Account";
                btn.innerText = "Зарегистрировать";
                switchText.innerHTML = "Уже есть аккаунт? <span>Войти</span>";
                regKeyGroup.classList.add('active');
            } else {
                title.innerText = "Secure Login";
                btn.innerText = "Войти";
                switchText.innerHTML = "Нет аккаунта? <span>Создать</span>";
                regKeyGroup.classList.remove('active');
            }
        }

        function handleAuthAction() {
            const user = document.getElementById('userInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;
            if (!user || !pass) { alert("Заполни все поля!"); return; }

            if (isRegisterMode) {
                const regKey = document.getElementById('regKeyInput').value;
                if (regKey !== "mailreg") { alert("Неверный ключ (нужен mailreg)!"); return; }
                if (localStorage.getItem(`pass_${user}`)) { alert("Ящик уже занят!"); return; }

                localStorage.setItem(`pass_${user}`, pass);
                alert("Успешно создано! Теперь войди.");
                toggleMode();
            } else {
                const savedPass = localStorage.getItem(`pass_${user}`);
                if (!savedPass || savedPass !== pass) { alert("Неверный логин или пароль!"); return; }

                currentUser = `${user}@sanchek.de`;
                localStorage.setItem('logged_user', currentUser);
                showDashboard();
            }
        }

        function logout() {
            localStorage.removeItem('logged_user');
            currentUser = null;
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('userBadge').innerText = currentUser;
            switchFolder('inbox', document.querySelector('.nav-item'));
        }

        function switchFolder(folder, element) {
            currentFolder = folder;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            const area = document.getElementById('mainContentArea');
            if (folder === 'custom') {
                area.innerHTML = `
                    <div class="custom-panel">
                        <h2>🎨 Кастомизация интерфейса</h2>
                        <div class="custom-section">
                            <label>Основной акцентный цвет (Неон / Свечение)</label>
                            <div class="color-pickers">
                                <input type="color" id="accentColorPicker" value="#00f0ff" onchange="changeAccent(this.value)">
                                <button class="btn" style="width:auto; margin:0; padding:8px 16px;" onclick="resetTheme()">Сбросить</button>
                            </div>
                        </div>
                        <p style="color:var(--text-muted); font-size:0.85rem; margin-top:20px;">Здесь ты можешь кастомизировать подсветку интерфейса под свой вкус. Изменения сохраняются автоматически.</p>
                    </div>
                `;
            } else {
                area.innerHTML = `
                    <div class="mail-list" id="mailListContainer"></div>
                    <div class="mail-reader" id="mailReader">
                        <div class="reader-header"><div class="reader-subject">Выберите письмо</div><div class="reader-meta">—</div></div>
                        <div class="reader-body">Нажмите на письмо в списке слева.</div>
                    </div>
                `;
                loadMails();
            }
        }

        function getMails() {
            const key = `mails_${currentUser}`;
            let data = localStorage.getItem(key);
            if (!data) { localStorage.setItem(key, JSON.stringify(sampleInbox)); return sampleInbox; }
            return JSON.parse(data);
        }

        function saveMails(mails) { localStorage.setItem(`mails_${currentUser}`, JSON.stringify(mails)); }

        function loadMails(query = '') {
            const container = document.getElementById('mailListContainer');
            if (!container) return;
            const mails = getMails().filter(m => m.folder === currentFolder);
            const filtered = mails.filter(m => m.sender.toLowerCase().includes(query.toLowerCase()) || m.subject.toLowerCase().includes(query.toLowerCase()));

            if (filtered.length === 0) {
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Папка пуста</div>`;
                return;
            }

            container.innerHTML = filtered.map(m => `
                <div class="mail-item ${activeMailId === m.id ? 'active' : ''}" onclick="openMail(${m.id})">
                    <div class="mail-sender">${m.sender}</div>
                    <div class="mail-subject">${m.subject}</div>
                    <div class="mail-snippet">${m.body.replace(/<[^>]*>?/gm, '')}</div>
                </div>
            `).join('');
        }

        function openMail(id) {
            activeMailId = id;
            loadMails();
            const mail = getMails().find(m => m.id === id);
            if (!mail) return;
            document.getElementById('mailReader').innerHTML = `
                <div class="reader-header"><div class="reader-subject">${mail.subject}</div><div class="reader-meta">От: ${mail.sender} • ${mail.time}</div></div>
                <div class="reader-body">${mail.body}</div>
            `;
        }

        function refreshInbox() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerText = "⏳ Обновление...";
            setTimeout(() => {
                loadMails();
                btn.innerText = "🔄 Обновить";
            }, 600);
        }

        function filterMails(q) { loadMails(q); }

        function openComposeModal() { document.getElementById('composeModal').classList.add('active'); }
        function closeComposeModal() { document.getElementById('composeModal').classList.remove('active'); }

        function sendMail() {
            const to = document.getElementById('composeTo').value.trim();
            const subject = document.getElementById('composeSubject').value.trim();
            const body = document.getElementById('composeBody').value.trim();
            if (!to || !subject || !body) { alert("Заполни все поля!"); return; }

            const mails = getMails();
            mails.unshift({ id: Date.now(), folder: 'sent', sender: to, subject, time: 'Только что', body: body.replace(/\n/g, '<br>') });
            saveMails(mails);
            closeComposeModal();
            alert("Письмо отправлено!");
            if (currentFolder === 'sent') loadMails();
        }

        // Кастомизация темы
        function changeAccent(color) {
            document.documentElement.style.setProperty('--accent-main', color);
            document.documentElement.style.setProperty('--accent-border', color + '66');
            document.documentElement.style.setProperty('--accent-glow', color + '22');
            localStorage.setItem('custom_accent', color);
        }

        function loadTheme() {
            const savedColor = localStorage.getItem('custom_accent');
            if (savedColor) changeAccent(savedColor);
        }

        function resetTheme() {
            changeAccent('#00f0ff');
            localStorage.removeItem('custom_accent');
        }
    </script>
</body>
</html>
