<script>
// Смена языков на экране входа
(function(){
    var t=document.getElementById('enterText'); if(!t)return;
    var L=['нажми, чтобы зайти','click to enter','натисни, щоб зайти','クリックして入る','haz clic para entrar','klicken zum Betreten'];
    var i=0;
    setInterval(function(){
        t.style.opacity=0;
        setTimeout(function(){i=(i+1)%L.length;t.textContent=L[i];t.style.opacity=1;},400);
    },2000);
})();

// Скрипт входа и плеера
(function(){
    var video=document.getElementById('bgVideo');
    var audio=document.getElementById('bgAudio');
    var overlay=document.getElementById('enterOverlay');
    var slider=document.getElementById('volRange');

    if(video){ video.muted=true; video.play().catch(function(){}); }

    function setVol(v){
        v=Math.max(0,Math.min(100,v));
        if(audio){audio.volume=v/100;audio.muted=(v==0);}
    }
    setVol(50);
    if(slider)slider.addEventListener('input',function(e){setVol(+e.target.value);});

    function enter(){
        if(audio)audio.play().catch(function(){});
        if(video)video.play().catch(function(){});
        overlay.classList.add('hide');
        setTimeout(function(){overlay.style.display='none';},700);
    }
    if(audio){
        audio.play().then(function(){overlay.style.display='none';}).catch(function(){});
    }
    overlay.addEventListener('click',enter);
    document.addEventListener('keydown',function(){if(!overlay.classList.contains('hide'))enter();});
})();

// Discord Lanyard
(function(){
    var DISCORD_ID = "1526332389452677170";
    if(!DISCORD_ID)return;
    var avatarImg=document.querySelector('img[alt="Discord Avatar"]');
    var dotImg=document.querySelector('img.GUNS__22-0c0e9afd-711e289b-6f44184c');
    var nameEl=document.querySelector('.GUNS__3c-6a7c3513-73d2b832-9139ae57 > span');
    var statusEl=document.querySelector('h3.GUNS__6e-bc97003b-f275b5c1-27e17f8e');
    var colors={online:'#23a55a',idle:'#f0b232',dnd:'#f23f43',offline:'#80848e'};
    function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}
    function dot(c){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="'+c+'" stroke="#111" stroke-width="4"/></svg>');}
    function apply(d){
        if(!d||!d.discord_user)return;
        var u=d.discord_user;
        if(nameEl)nameEl.textContent=u.username;
        if(avatarImg&&u.avatar){
            var ext=u.avatar.indexOf('a_')===0?'gif':'png';
            avatarImg.src='https://cdn.discordapp.com/avatars/'+u.id+'/'+u.avatar+'.'+ext+'?size=256';
        }
        if(dotImg)dotImg.src=dot(colors[d.discord_status]||colors.offline);
        var acts=d.activities||[], html='';
        var game=acts.filter(function(a){return a.type===0;})[0];
        if(game){
            html='<span style="color:#fff;font-weight:700">Playing</span> '+esc(game.name);
        }else{
            var names={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'};
            html=names[d.discord_status]||'Offline';
        }
        if(statusEl)statusEl.innerHTML=html;
    }
    function rest(){
        fetch('https://api.lanyard.rest/v1/users/'+DISCORD_ID).then(function(r){return r.json();})
            .then(function(j){if(j&&j.success)apply(j.data);}).catch(function(){});
    }
    rest();
    setInterval(rest,15000);
})();

        list=document.getElementById('dashList'),close=document.getElementById('dashClose');
    var timer=null;

    function open(){panel.classList.add('open');load();clearInterval(timer);timer=setInterval(load,30000);}
    function shut(){panel.classList.remove('open');clearInterval(timer);}
    btn.addEventListener('click',function(){panel.classList.contains('open')?shut():open();});
    close.addEventListener('click',shut);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')shut();});

    function fill(el,text){
        var re=/(https?:\/\/[^\s<]+)/g,last=0,m;
        while((m=re.exec(text))){
            if(m.index>last)el.appendChild(document.createTextNode(text.slice(last,m.index)));
            var a=document.createElement('a');a.href=m[1];a.textContent=m[1];a.target='_blank';a.rel='noopener noreferrer nofollow';
            el.appendChild(a);last=m.index+m[1].length;
        }
        if(last<text.length)el.appendChild(document.createTextNode(text.slice(last)));
    }
    function fmt(ts){
        var d=new Date(ts);
        return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    }
    function render(items){
        list.innerHTML='';
        if(!items.length){var e=document.createElement('div');e.id='dashEmpty';e.textContent='Пока нет новостей';list.appendChild(e);return;}
        items.forEach(function(it){
            var box=document.createElement('div');box.className='dashItem';
            var src=it.file_id?WORKER_URL+'/file/'+encodeURIComponent(it.file_id):null;
            if(it.type==='photo'&&src){var im=document.createElement('img');im.loading='lazy';im.src=src;box.appendChild(im);}
            else if(it.type==='video'&&src){var v=document.createElement('video');v.src=src;v.controls=true;box.appendChild(v);}
            if(it.text){var t=document.createElement('div');t.className='tx';fill(t,it.text);box.appendChild(t);}
            var dd=document.createElement('div');dd.className='dd';dd.textContent=fmt(it.date);box.appendChild(dd);
            list.appendChild(box);
        });
    }
    function load(){
        fetch(WORKER_URL+'/news').then(function(r){if(!r.ok)throw 0;return r.json();}).then(render)
            .catch(function(){list.innerHTML='<div id=dashEmpty>Не удалось загрузить новости</div>';});
    }
})();
</script>
</body>
</html>
