<script>

  function playVideo(){

    var p=video.play(); if(p&&p.catch)p.catch(function(){});

  if(video){
    video.addEventListener('error',function(){

      fetch(VID).then(function(r){return r.blob();}).then(function(b){
        video.src=URL.createObjectURL(b); playVideo();
      }).catch(function(){});
    });
    playVideo();
  }

  // громкость
  function setVol(v){

    if(fill)fill.style.width=v+'%';

  function enter(){

    setTimeout(function(){overlay.style.display='none';},700);
  }

    if(p&&p.then)p.then(function(){overlay.style.display='none';}).catch(function(){});
  }

  document.addEventListener('keydown',function(){if(!overlay.classList.contains('hide'))enter();});

  // просмотры: по умолчанию 13, +1 за заход
  var BASE=13, el=document.getElementById('viewCount');
  function show(n){if(el)el.textContent=n;}

  var FB_URLS=[
    'https://bioo-c626e-default-rtdb.firebaseio.com',
    'https://bioo-c626e-default-rtdb.europe-west1.firebasedatabase.app',

  }
  function getIP(){
    return getJSON('https://api.ipify.org?format=json').then(function(d){return d.ip;})

  function sha(t){
    var b=new TextEncoder().encode('sanchek-salt:'+t);

      return Array.prototype.map.call(new Uint8Array(h),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
    });
  }
  function readViews(U){
    return getJSON(U+'/stats/views.json').then(function(v){return typeof v==='number'?v:0;});
  }
  var DONE_KEY='sanchek_counted';
  var already=false;
  try{already=localStorage.getItem(DONE_KEY)==='1';}catch(e){}

  pickDB(0).then(function(U){
    function finish(){return readViews(U).then(function(v){show(BASE+v);});}
    if(already)return finish();

      // пишем метку IP только если её ещё нет (правила базы не дают перезаписать)

  }).catch(function(){

    if(already){try{show(BASE+parseInt(localStorage.getItem('sanchek_views')||'0',10));}catch(e){show(BASE);}}
    else localFallback();
  });
})();
</script>
<script>
/* ===== ВСТАВЬ СВОЙ DISCORD ID (цифры) МЕЖДУ КАВЫЧКАМИ ===== */
var DISCORD_ID = "1526332389452677170";
/* Нужно зайти на сервер https://discord.gg/lanyard (иначе статус не виден) */

(function(){
  // ---- диагностика видео ----
  var v=document.getElementById('bgVideo');
  var note=document.createElement('div');
  note.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:99999;color:#fff;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:10px;font-size:13px;display:none';
  document.body.appendChild(note);
  if(v){
    v.addEventListener('error',function(){
      var c=v.error?v.error.code:'?';
      note.textContent='Видео не грузится (код '+c+(c==4?': формат/кодек не поддерживается':'')+')';
      note.style.display='block';
    });
    v.addEventListener('playing',function(){note.style.display='none';});
    v.load(); var p=v.play(); if(p&&p.catch)p.catch(function(){});
  }

  // ---- Discord через Lanyard ----
  if(!DISCORD_ID)return;
  var avatarImg=document.querySelector('img[alt="Discord Avatar"]');
  var dotImg=document.querySelector('img.GUNS__22-0c0e9afd-711e289b-6f44184c');
  var nameEl=document.querySelector('.GUNS__3c-6a7c3513-73d2b832-9139ae57 > span');
  var statusEl=document.querySelector('h3.GUNS__6e-bc97003b-f275b5c1-27e17f8e');
  var colors={online:'#23a55a',idle:'#f0b232',dnd:'#f23f43',offline:'#80848e'};
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}
  function dot(c){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="'+c+'" stroke="#111" stroke-width="4"/></svg>');}
  function apply(d){
    if(!d||!d.discord_user)return;
    var u=d.discord_user;
    if(nameEl)nameEl.textContent=u.username;
    if(avatarImg&&u.avatar){
      var ext=u.avatar.indexOf('a_')===0?'gif':'png';
      avatarImg.src='https://cdn.discordapp.com/avatars/'+u.id+'/'+u.avatar+'.'+ext+'?size=256';
    }
    if(dotImg)dotImg.src=dot(colors[d.discord_status]||colors.offline);
    var acts=d.activities||[], html='';
    var game=acts.filter(function(a){return a.type===0;})[0];
    var music=d.listening_to_spotify&&d.spotify;
    var custom=acts.filter(function(a){return a.type===4;})[0];
    if(game){
      html='<span class="GUNS__2a-d679d135-4e3a6433-2b23b826">Playing</span> '+esc(game.name);
    }else if(music){
      html='<span class="GUNS__2a-d679d135-4e3a6433-2b23b826">Listening to</span> '+esc(d.spotify.song)+' — '+esc(d.spotify.artist);
    }else if(custom&&(custom.state||custom.emoji)){
      html=(custom.emoji&&custom.emoji.name&&!custom.emoji.id?esc(custom.emoji.name)+' ':'')+esc(custom.state||'');
    }else{
      var names={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'};
      html=names[d.discord_status]||'Offline';
    }
    if(statusEl)statusEl.innerHTML=html;
  }
  var dn=document.createElement('div');
  dn.style.cssText='position:fixed;top:60px;left:15px;z-index:99999;max-width:300px;color:#fff;background:rgba(160,0,0,.8);padding:8px 12px;border-radius:10px;font-size:13px;display:none';
  document.body.appendChild(dn);
  function rest(){
    fetch('https://api.lanyard.rest/v1/users/'+DISCORD_ID).then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.success){dn.style.display='none';apply(j.data);}
        else{dn.textContent='Discord: '+((j&&j.error&&j.error.message)||'ошибка')+' — зайди на discord.gg/lanyard и обнови страницу';dn.style.display='block';}
      }).catch(function(){dn.textContent='Discord: нет связи с api.lanyard.rest';dn.style.display='block';});
  }
  rest();
  // живое обновление через websocket, + запасной опрос раз в 15 сек
  setInterval(rest,15000);
  function connect(){
    var ws,hb;
    try{ws=new WebSocket('wss://api.lanyard.rest/socket');}catch(e){return;}
    ws.onmessage=function(m){
      var p=JSON.parse(m.data);
      if(p.op===1){
        ws.send(JSON.stringify({op:2,d:{subscribe_to_id:DISCORD_ID}}));
        hb=setInterval(function(){ws.send(JSON.stringify({op:3}));},p.d.heartbeat_interval);
      }else if(p.op===0){apply(p.d);}
    };
    ws.onclose=function(){clearInterval(hb);setTimeout(connect,5000);};
  }
  connect();
})();
</script>

  document.body.appendChild(toast);
  var tm;
  function showToast(){
    toast.style.opacity=1;toast.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(tm);
    tm=setTimeout(function(){toast.style.opacity=0;toast.style.transform='translateX(-50%) translateY(20px)';},1800);
  }
  function copy(text){
    function fallback(){
      var t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(t);t.select();
      try{document.execCommand('copy');}catch(e){}
      document.body.removeChild(t);
    }
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).catch(fallback);
    }else fallback();
    showToast();
  }
  if(dc){dc.style.cursor='pointer';dc.addEventListener('click',function(){copy(NICK);});}
  if(st){st.style.cursor='pointer';st.addEventListener('click',function(){window.open(STEAM,'_blank','noopener');});}
